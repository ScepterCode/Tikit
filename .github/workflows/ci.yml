name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      # Runs the no-hardcoded-URL guard via the `prebuild` hook.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-fastapi
    env:
      ENVIRONMENT: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: eyJ0ZXN0IjogMX0.signature.value
      SUPABASE_SERVICE_KEY: eyJ0ZXN0IjogMX0.signature.value
      SUPABASE_SERVICE_ROLE_KEY: eyJ0ZXN0IjogMX0.signature.value
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend-fastapi/requirements.txt

      - run: pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q

  security-scan:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high
        continue-on-error: true
