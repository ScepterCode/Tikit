name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      # Runs the no-hardcoded-URL guard via the `prebuild` hook.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-fastapi
    env:
      ENVIRONMENT: development
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: eyJ0ZXN0IjogMX0.signature.value
      SUPABASE_SERVICE_KEY: eyJ0ZXN0IjogMX0.signature.value
      SUPABASE_SERVICE_ROLE_KEY: eyJ0ZXN0IjogMX0.signature.value
      JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend-fastapi/requirements.txt

      - run: pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest -q

  security-scan:
    name: Security scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: Walking skeleton (staging)
    runs-on: ubuntu-latest
    # Runs only where the staging secrets exist. Without them the suite skips
    # anyway, but there is no point spinning up a browser to prove it.
    if: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: apps/frontend
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
      BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Walking skeleton
        run: npm run test:e2e

      - name: Upload traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/frontend/test-results
          retention-days: 7
